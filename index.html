<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>9th Grade Academy — Curriculum Guide 2026–27</title>
<style>
:root{
  --sel:#1D9E75;--sel-bg:#E1F5EE;--sel-t:#085041;--sel-tag:#9FE1CB;
  --ef:#534AB7;--ef-bg:#EEEDFE;--ef-t:#26215C;--ef-tag:#CECBF6;
  --gpa:#BA7517;--gpa-bg:#FAEEDA;--gpa-t:#412402;--gpa-tag:#FAC775;
  --ip:#D4537E;--ip-bg:#FBEAF0;--ip-t:#4B1528;--ip-tag:#F4C0D1;
  --stu:#185FA5;--stu-bg:#E6F1FB;--stu-t:#042C53;--stu-tag:#B5D4F4;
  --ref:#534AB7;--ref-bg:#EEEDFE;--ref-t:#26215C;--ref-tag:#CECBF6;
  --b-bg:#E1F5EE;--b-t:#085041;--b-c:#1D9E75;
  --e-bg:#E6F1FB;--e-t:#042C53;--e-c:#185FA5;
  --a-bg:#FAEEDA;--a-t:#412402;--a-c:#BA7517;
  --t-bg:#EEEDFE;--t-t:#26215C;--t-c:#534AB7;
  --bg:#F7F6F2;--surface:#fff;--border:#E4E2DA;
  --text:#1A1A18;--muted:#6B6B67;--faint:#AEADA8;
  --r:10px;--rs:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
body{color:var(--text)}
.shell{display:flex;min-height:100vh}
.sidebar{width:230px;min-width:230px;background:var(--surface);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;overflow-y:auto;flex-shrink:0}
.main{flex:1;padding:2rem 2.5rem;max-width:1120px}
.sb-logo{padding:1.25rem 1.25rem .75rem;border-bottom:1px solid var(--border)}
.sb-logo h2{font-size:13px;font-weight:600;color:var(--text);line-height:1.4}
.sb-logo p{font-size:11px;color:var(--muted);margin-top:2px}
.sb-sec{padding:.4rem 0;border-bottom:1px solid var(--border)}
.sb-lbl{font-size:10px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;padding:.4rem 1.25rem .2rem}
.sb-item{display:flex;align-items:center;gap:8px;padding:5px 1.25rem;cursor:pointer;font-size:13px;color:var(--muted);border-left:3px solid transparent;transition:all .12s}
.sb-item:hover{background:var(--bg);color:var(--text)}
.sb-item.active{background:var(--bg);font-weight:500;color:var(--text)}
.sb-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ph{margin-bottom:1.75rem;padding-bottom:1.25rem;border-bottom:1px solid var(--border)}
.ph h1{font-size:24px;font-weight:500;margin-bottom:5px}
.ph p{font-size:14px;color:var(--muted);line-height:1.6;max-width:600px}
.ph-pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ph-pill{font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;background:var(--surface);border:1px solid var(--border);color:var(--muted)}
.beat-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:1.25rem}
.beat-bar span.lbl{font-size:11px;font-weight:600;color:var(--muted)}
.bc{font-size:11px;font-weight:500;padding:3px 9px;border-radius:10px}
.vbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px}
.vtg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:5px;overflow:hidden}
.vt{padding:5px 14px;font-size:12px;font-weight:500;cursor:pointer;color:var(--muted);border:none;background:transparent;font-family:inherit;transition:all .12s}
.vt.active{background:var(--text);color:#fff}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem}
.lc{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);padding:3px 8px;border-radius:12px;cursor:pointer;border:0.5px solid transparent;transition:all .12s}
.lc:hover{background:#f0f0ec}
.lc.dim{opacity:.3}
.ld{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.cc{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);overflow:hidden;cursor:pointer;transition:border-color .12s,box-shadow .12s}
.cc:hover{border-color:#aaa;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.cc.brk{opacity:.4;cursor:default;background:var(--bg)}
.cc.brk:hover{border-color:var(--border);box-shadow:none}
.cc.ref{border-width:2px}
.cc.act{box-shadow:0 0 0 2px var(--text)!important}
.ch{padding:6px 9px 5px;display:flex;justify-content:space-between;align-items:center}
.cwk{font-size:9px;font-weight:500}
.cdt{font-size:9px;color:var(--faint)}
.cb{padding:0 9px 8px}
.ct{font-size:11px;font-weight:500;line-height:1.3;margin-bottom:4px}
.cps{display:flex;flex-direction:column;gap:2px}
.cp{font-size:9px;padding:2px 5px;border-radius:3px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btp{font-size:9px;padding:2px 5px;border-radius:3px;font-weight:500;line-height:1.4}
.lv{display:flex;flex-direction:column;gap:4px}
.lr{display:flex;align-items:stretch;border:1px solid var(--border);border-radius:var(--rs);overflow:hidden;cursor:pointer;background:var(--surface);transition:border-color .12s}
.lr:hover{border-color:#aaa}
.lr.brk{opacity:.4;cursor:default;background:var(--bg)}
.lr.brk:hover{border-color:var(--border)}
.lr.ref{border-width:2px}
.lwk{width:52px;min-width:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7px 4px;font-size:9px;font-weight:500}
.lmd{flex:1;padding:7px 12px}
.lt{font-size:13px;font-weight:500;margin-bottom:2px}
.lp{font-size:11px;color:var(--muted);line-height:1.4}
.lrt{width:110px;min-width:110px;display:flex;align-items:center;justify-content:center;padding:6px;font-size:10px;font-weight:500;text-align:center;line-height:1.3}
.det{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.25rem;margin-bottom:1rem}
.det-cl{font-size:12px;color:var(--muted);cursor:pointer;margin-bottom:.75rem;display:inline-block}
.det-cl:hover{color:var(--text)}
.dt{font-size:20px;font-weight:500;margin-bottom:4px}
.dm{font-size:12px;color:var(--muted);margin-bottom:.5rem}
.dbeat{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:3px 10px;border-radius:10px;margin-bottom:.75rem}
.lg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:.75rem}
.lcard{border-radius:var(--rs);padding:10px 11px;border:1px solid var(--border);background:var(--bg)}
.lcard.gc{border-left:2.5px solid var(--gpa)}
.lcard.rc{border-left:2.5px solid var(--ref)}
.ldy{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);margin-bottom:3px}
.lti{font-size:12px;font-weight:600;color:var(--text);line-height:1.3;margin-bottom:4px}
.ltg{display:inline-block;font-size:9px;font-weight:500;padding:2px 5px;border-radius:3px;margin-bottom:5px}
.ls{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);margin-top:6px;margin-bottom:2px}
.ltx{font-size:11px;color:var(--text);line-height:1.5}
.lcl{font-size:11px;color:var(--muted);font-style:italic;line-height:1.5}
.about-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:1.25rem 0}
.ac{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.25rem}
.ac h3{font-size:14px;font-weight:600;margin-bottom:6px}
.ac p{font-size:13px;color:var(--muted);line-height:1.6}
.ul{display:flex;flex-direction:column;gap:7px;margin:1rem 0}
.ui{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--rs)}
.ud{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.ul-lbl{font-size:14px;font-weight:500;flex:1}
.ul-wk{font-size:11px;color:var(--muted)}
.nb{background:#FAEEDA;border-radius:var(--rs);padding:10px 14px;font-size:13px;color:#412402;line-height:1.6;margin-top:1rem}
@media(max-width:900px){.shell{flex-direction:column}.sidebar{width:100%;height:auto;position:static;border-right:none;border-bottom:1px solid var(--border)}.main{padding:1.25rem}.cg{grid-template-columns:repeat(2,1fr)}.lg{grid-template-columns:repeat(2,1fr)}.about-g{grid-template-columns:1fr}}
</style>
</head>

const {UNITS,BEAT,GPA_CHECKINS,WEEKS}=DATA;
const BREAKS={14:'Thanksgiving week',21:'Winter holiday',26:'Winter break',33:'Spring break'};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function buildCal(){
  const start=new Date(2026,7,24);
  const rows=[];let iw=0;
  const brk=[[new Date(2026,10,25),new Date(2026,10,27),'Thanksgiving week'],
              [new Date(2026,11,23),new Date(2027,0,1),'Winter holiday'],
              [new Date(2027,1,15),new Date(2027,1,19),'Winter break'],
              [new Date(2027,2,29),new Date(2027,3,2),'Spring break']];
  const singles=[new Date(2026,8,7),new Date(2026,9,12),new Date(2026,10,6),new Date(2027,0,18),new Date(2027,4,31)];
  function inBreak(d){
    for(const [s,e,lbl] of brk){
      const mon=new Date(d);
      const fri=new Date(d);fri.setDate(fri.getDate()+4);
      if(fri>=s&&mon<=e)return lbl;
    }
    return null;
  }
  for(let cw=1;cw<=52;cw++){
    const d=new Date(start);d.setDate(d.getDate()+(cw-1)*7);
    if(d.getFullYear()>2027||(d.getFullYear()===2027&&d.getMonth()>5))break;
    const ds=MON[d.getMonth()]+' '+d.getDate();
    const bk=inBreak(d);
    if(bk){rows.push({cw,isBreak:true,label:bk,dateStr:ds});}
    else{iw++;if(iw<=WEEKS.length)rows.push({cw,isBreak:false,iw,dateStr:ds,...WEEKS[iw-1]});}
  }
  return rows;
}
const CAL=buildCal();

let view='calendar',activeWk=null,filt=null,sec='cal';

function u(id){return UNITS[id]||UNITS.sel;}
function b(k){return BEAT[k]||BEAT.A;}

function nav(s){
  sec=s;activeWk=null;
  document.querySelectorAll('.sb-item').forEach(e=>{
    e.classList.remove('active');
    e.style.borderLeftColor='transparent';
    e.style.color='';
  });
  const n=document.getElementById('n-'+s);
  if(n){
    n.classList.add('active');
    const dot=n.querySelector('.sb-dot');
    if(dot){n.style.borderLeftColor=dot.style.background;n.style.color=dot.style.background;}
  }
  renderMain();
}

function renderMain(){
  const el=document.getElementById('mc');
  if(sec==='cal')el.innerHTML=renderCal();
  else if(sec==='about')el.innerHTML=renderAbout();
  else if(UNITS[sec])el.innerHTML=renderUnit(sec);
  attachCal();
}

  <div class="ul">${ulist}</div>
  <div class="nb"><strong>School year 2026–27:</strong> First day Aug 24, 2026. Breaks: Thanksgiving (Nov 25–27), Winter holiday (Dec 23–Jan 1), Winter break (Feb 15–19), Spring break (Mar 29–Apr 2). Orientation: Aug 19–21. Q1 ends Oct 30 · Q2 ends Jan 29 · Q3 ends Apr 16.</div>
  <div style="margin-top:1.25rem;font-size:13px;color:var(--muted);line-height:1.7"><strong>How to use this guide:</strong> Use the sidebar to navigate between the full calendar, individual unit pages, and this reference page. Click any week in the calendar to expand all four lesson plans. Filter by unit using the color chips. Use List view for a quick linear overview of the full year.</div>`;
}

function setV(v){
  view=v;
  document.querySelectorAll('.vt').forEach(b=>b.classList.toggle('active',
    (v==='calendar'&&b.textContent==='Calendar')||(v==='list'&&b.textContent==='List')));
  activeWk=null;
  const d=document.getElementById('det');if(d)d.innerHTML='';
  const cb=document.getElementById('cb');if(cb)cb.innerHTML=view==='calendar'?renderGrid():renderList();
  attachCal();
}

function filterU(id){
  filt=filt===id?null:id;
  document.querySelectorAll('.lc').forEach(el=>{
    const m=el.getAttribute('onclick');
    if(m){const k=m.match(/'(\w+)'/)?.[1];if(k)el.classList.toggle('dim',filt&&filt!==k);}
  });
  const cb=document.getElementById('cb');if(cb)cb.innerHTML=view==='calendar'?renderGrid():renderList();
  attachCal();
}

function attachCal(){
  document.querySelectorAll('[data-iw]').forEach(el=>{
    el.onclick=function(){selectWk(parseInt(this.getAttribute('data-iw')));};
  });
}

function selectWk(iw){
  activeWk=iw;
  const d=document.getElementById('det');
  if(d){d.innerHTML=renderDrawer(iw);d.scrollIntoView({behavior:'smooth',block:'nearest'});}
  document.querySelectorAll('[data-iw]').forEach(el=>
    el.classList.toggle('act',parseInt(el.getAttribute('data-iw'))===iw));
}

function closeDet(){
  activeWk=null;
  const d=document.getElementById('det');if(d)d.innerHTML='';
  document.querySelectorAll('[data-iw]').forEach(el=>el.classList.remove('act'));
}

nav('cal');
</script>
</body>
</html>
